openapi: 3.0.0
paths:
  /api/v1/services:
    get:
      operationId: ServicesController_findAll
      parameters:
        - name: q
          required: false
          in: query
          schema:
            maxLength: 50
            type: string
        - name: sort
          required: false
          in: query
          schema:
            default: name
            enum:
              - name
              - createdAt
              - updatedAt
            type: string
        - name: order
          required: false
          in: query
          schema:
            default: asc
            enum:
              - asc
              - desc
            type: string
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            type: number
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 12
            type: number
      responses:
        '200':
          description: ''
    post:
      operationId: ServicesController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
  /api/v1/services/{id}:
    get:
      operationId: ServicesController_findOne
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
    patch:
      operationId: ServicesController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
    delete:
      operationId: ServicesController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: ''
  /api/v1/services/{serviceId}/versions:
    get:
      operationId: VersionsController_findByService
      parameters:
        - name: serviceId
          required: true
          in: path
          schema:
            type: string
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            type: number
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 12
            type: number
      responses:
        '200':
          description: ''
    post:
      operationId: VersionsController_create
      parameters:
        - name: serviceId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVersionDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
  /api/v1/services/{serviceId}/versions/{versionId}:
    patch:
      operationId: VersionsController_update
      parameters:
        - name: serviceId
          required: true
          in: path
          schema:
            type: string
        - name: versionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVersionDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
    delete:
      operationId: VersionsController_remove
      parameters:
        - name: serviceId
          required: true
          in: path
          schema:
            type: string
        - name: versionId
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: ''
info:
  title: Services Catalog API
  description: Services and their versions.
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    Service:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        versions:
          type: array
          items:
            $ref: '#/components/schemas/Version'
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - name
        - description
        - versions
        - createdAt
        - updatedAt
    Version:
      type: object
      properties:
        id:
          type: string
        service:
          $ref: '#/components/schemas/Service'
        serviceId:
          type: string
        version:
          type: string
        changelog:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - service
        - serviceId
        - version
        - changelog
        - description
        - createdAt
        - updatedAt
    CreateVersionDto:
      type: object
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 50
        changelog:
          type: string
          minLength: 1
        description:
          type: string
      required:
        - version
        - changelog
    CreateServiceDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        version:
          $ref: '#/components/schemas/CreateVersionDto'
      required:
        - name
        - description
        - version
    UpdateServiceDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
    UpdateVersionDto:
      type: object
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 50
        changelog:
          type: string
          minLength: 1
        description:
          type: string
